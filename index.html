At 25 you should have a stable job.

Who do you think is richer?

Because she already owns a home worth RM500,000.
But a home worth RM500,000 doesn't mean she has RM500,000 in net worth.
If she still owes the bank RM450,000, her equity in that home is only RM50,000 on paper.

We'd still need to look at both women's other assets, debts, income, and how much each can build up every month.
What I want to say is: **owning a home and owning wealth have never been quite the same thing.**
———

Are you willing to live in the same place for ten years?
Might you move for work in the future?
Do you want to start a business, move abroad, or try a different way of living?

/* ---------- 自动翻译（没写 en 的文章才会用到） ---------- */
async function gtChunk(text){
  const url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-CN&tl=en&dt=t&q=" + encodeURIComponent(text);
  const r = await fetch(url);
  const data = await r.json();
  return data[0].map(x => x[0]).join("");
}
async function translateLines(lines){
  const out = new Array(lines.length);
  const groups = []; let cur = [], len = 0;
  lines.forEach((l, i) => {
    if (len + l.length > 350 && cur.length){ groups.push(cur); cur = []; len = 0; }
    cur.push(i); len += l.length + 1;
  });
  if (cur.length) groups.push(cur);
  await Promise.all(groups.map(async g => {
    try {
      const res = (await gtChunk(g.map(i => lines[i]).join("\n"))).split("\n");
      if (res.length === g.length) g.forEach((i, k) => out[i] = res[k].trim());
      else await Promise.all(g.map(async i => { out[i] = (await gtChunk(lines[i])).trim(); }));
    } catch(e){ g.forEach(i => out[i] = lines[i]); }
  }));
  return out;
}
async function autoEn(a, full){
  const key = `tr_${full ? "full" : "meta"}_${a.slug}_${a.date}`;
  const cached = store.get(key);
  if (cached){ try { return JSON.parse(cached); } catch(e){} }
  const meta = [a.series, a.title, a.summary];
  let lines = meta.slice();
  let bodyLines = [];
  if (full){
    bodyLines = a.body.trim().split("\n").map(l => l.trim()).filter(Boolean);
    lines = lines.concat(
      [a.cta?.title || "", a.cta?.text || "", a.question || ""],
      (a.poll || []).map(o => o.label),
      bodyLines
    );
  }
  const tr = await translateLines(lines);
  const en = { series: tr[0], title: tr[1], summary: tr[2] };
  if (full){
    en.cta = { title: tr[3], text: tr[4] };
    en.question = tr[5];
    const pn = (a.poll || []).length;
    en.poll = tr.slice(6, 6 + pn);
    en.body = tr.slice(6 + pn).map(l => l.replace(/^[“"](.*)[”"]$/, "「$1」").replace(/\*\*\s*(.+?)\s*\*\*/g, "**$1**")).join("\n");
  }
  en.auto = true;
  store.set(key, JSON.stringify(en));
  return en;
}
async function localize(a, full){
  if (lang === "zh") return { ...a, auto: false };
  const en = a.en || await autoEn(a, full);
  const poll = a.poll ? a.poll.map((o, i) => ({ ...o, label: (en.poll && en.poll[i]) || o.label })) : null;
  return { ...a, ...en, cta: en.cta || a.cta, poll, auto: !a.en };
}

/* ---------- 工具 ---------- */
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
const dnaLink = slug => `${SITE.dnaUrl}?utm_source=articles&utm_medium=article&utm_campaign=${encodeURIComponent(slug || "home")}&utm_content=${lang}`;
const readMin = body => lang === "zh"
  ? Math.max(1, Math.round(body.replace(/\s/g, "").length / 400))
  : Math.max(1, Math.round(body.split(/\s+/).length / 220));

function format(body){
  const lines = body.trim().split("\n").map(l => l.trim()).filter(Boolean);
  let html = "", steps = [];
  const flush = () => { if (steps.length){ html += `<ol class="steps">${steps.join("")}</ol>`; steps = []; } };
  for (const l of lines){
    const step = l.match(/^([①②③④⑤⑥⑦⑧⑨])\s*(.*)$/);
    if (step){ const n = "①②③④⑤⑥⑦⑧⑨".indexOf(step[1]) + 1; steps.push(`<li><b>${n}</b><span>${inline(step[2])}</span></li>`); continue; }
    flush();
    if (/^[—\-]{3,}$/.test(l)) html += "<hr>";
    else if (/^「.*」$/.test(l)) html += `<blockquote>${inline(lang === "en" ? "“" + l.slice(1, -1) + "”" : l)}</blockquote>`;
    else html += `<p>${inline(l)}</p>`;
  }
  flush();
  return html;
}

  const label = k => { const o = (a.poll || []).find(p => p.key === k); return o ? `${o.emoji || ""} ${o.label}` : ""; };
  list.innerHTML = rows.length ? rows.map(c => {
    const secs = Math.max(0, (Date.now() - new Date(c.created_at)) / 1000);
    return `<div class="c">
      <div class="av">${esc((c.name || "?").trim().charAt(0).toUpperCase())}</div>
      <div>
        <div class="who">${esc(c.name)}<small>${t().ago(secs)}</small></div>
        ${c.choice && label(c.choice) ? `<div class="pick">${t().cPicked} ${esc(label(c.choice))}</div>` : ""}
        <p>${esc(c.body)}</p>
      </div>
    </div>`;
  }).join("") : `<div class="empty">${t().cEmpty}</div>`;
}

function comments(a){
  const form = document.getElementById("cform");
  const savedName = store.get("comment_name");
  if (savedName) document.getElementById("cName").value = savedName;
  form.onsubmit = async e => {
    e.preventDefault();
    const btn = form.querySelector("button");
    const name = document.getElementById("cName").value.trim().slice(0, 40) || t().cAnon;
    const body = document.getElementById("cBody").value.trim().slice(0, 600);
    if (!body) return;
    btn.disabled = true; btn.textContent = t().cSending;
    let ok = false;
    try {
      const r = await fetch(CM_URL, { method: "POST", headers: { ...sbHeaders, Prefer: "return=minimal" },
        body: JSON.stringify({ slug: a.slug, name, body, choice: store.get("poll_voted_" + a.slug), lang }) });
      ok = r.ok;
    } catch(err){}
    btn.disabled = false; btn.textContent = t().cSend;
    if (!ok) return alert(t().cFail);
    if (name !== t().cAnon) store.set("comment_name", name);
    document.getElementById("cBody").value = "";
    loadComments(a);
  };
  loadComments(a);
}

/* ---------- 切换页面 ---------- */
const currentSlug = () => { try { return location.hash.replace(/^#\/?/, ""); } catch(e){ return ""; } };
function show(slug){
  chrome();
  const i = ARTICLES.findIndex(a => a.slug === slug);
  i >= 0 ? article(ARTICLES[i], i) : home();
  window.scrollTo(0, 0);
}
document.addEventListener("click", e => {
  const a = e.target.closest('a[href^="#/"]');
  if (!a) return;
  e.preventDefault();
  const slug = a.getAttribute("href").slice(2);
  try { history.pushState(null, "", "#/" + slug); } catch(err){}
  show(slug);
});
document.getElementById("langBtn").addEventListener("click", () => {
  lang = lang === "zh" ? "en" : "zh";
  store.set("lang", lang);
  show(currentSlug());
});
window.addEventListener("popstate", () => show(currentSlug()));
show(currentSlug());
</script>
