到了30岁这个年纪，身边的人开始只讲2件事，赚钱和存钱。
有个朋友问我，月薪 RM5,000，每个月扣掉 EPF、SOCSO、房租、车贷、吃饭、保险、交通和生活开销，月底剩 RM200。

有些人应该先还清高息债务。

Once you hit 30, the people around you start talking about just two things: making money and saving money.
A friend told me she earns RM5,000 a month. After EPF, SOCSO, rent, car loan, food, insurance, transport and daily expenses, she has RM200 left at the end of the month.
She asked me:
「Should I start investing already? Otherwise, when will I ever get rich?」
But if it were me, I wouldn't rush her into investing.
A lot of "safe" investments actually come with capital requirements — often a minimum of RM250k.
And very often, investing simply isn't right for everyone. My friend doesn't have enough of a buffer yet.
I often see people forced to sell their stocks at a loss because of an emergency.
**Some people invest with spare money. Some invest with the money they'd need to survive.**
I invest with spare money — money I won't need to touch for a long while.
3 years, 5 years, 10 years — I have enough reserves to pack up and go whenever I want, and to handle any emergency.
I build my reserves first, and only then invest what's left over.
But many people keep nothing on hand, and panic the moment something happens.
———
Say she can only save RM200 a month. That's RM2,400 a year.
What if she suddenly needs RM3,000 to fix her car, or loses her job for two months?
Credit card? Borrow money? Or sell the investments she just bought?
That's why I think one idea matters more than most in personal finance:
**Not everyone's next step should be investing.**
Some people should pay off high-interest debt first.
Some people should build an emergency fund first.
Some people already have enough cash reserves, and are ready for long-term investing.
And for some, the real problem to solve is income.
Two women earning the same RM5,000 can have completely different next steps, because their assets, debts and responsibilities are different.
If I were her, I'd do three things first:
① Work out exactly where my money goes every month.
② Find a way to keep an extra RM300–500 each month — without forcing myself to live miserably from day one.
③ Build a cash buffer first, then plan my investments around my own situation.
Of course, if essential spending is already cut to the bone, saving alone can't fix the problem.
Growing your income should be part of the plan too.
———
I've always believed that **wealth doesn't start when you buy your first stock. It starts when you make your first financial decision that's right for you.**
You don't need to get rich today.
But you should know what your next step is, today.
I hope every ordinary woman can find the money moves that fit her own situation, and build her assets one step at a time.

/* ---------- 语言 ---------- */
const store = {
  get: k => { try { return localStorage.getItem(k); } catch(e){ return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch(e){} }
};
let lang = (() => {
  try { const p = new URLSearchParams(location.search).get("lang"); if (p === "en" || p === "zh") return p; } catch(e){}
  return store.get("lang") === "en" ? "en" : "zh";
})();
const t = () => T[lang];

/* ---------- 自动翻译（没写 en 的文章才会用到） ---------- */
async function gtChunk(text){
  const url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-CN&tl=en&dt=t&q=" + encodeURIComponent(text);
  const r = await fetch(url);
  const data = await r.json();
  return data[0].map(x => x[0]).join("");
}
async function translateLines(lines){
  const out = new Array(lines.length);
  const groups = []; let cur = [], len = 0;
  lines.forEach((l, i) => {
    if (len + l.length > 350 && cur.length){ groups.push(cur); cur = []; len = 0; }
    cur.push(i); len += l.length + 1;
  });
  if (cur.length) groups.push(cur);
  await Promise.all(groups.map(async g => {
    try {
      const res = (await gtChunk(g.map(i => lines[i]).join("\n"))).split("\n");
      if (res.length === g.length) g.forEach((i, k) => out[i] = res[k].trim());
      else await Promise.all(g.map(async i => { out[i] = (await gtChunk(lines[i])).trim(); }));
    } catch(e){ g.forEach(i => out[i] = lines[i]); }
  }));
  return out;
}
async function autoEn(a, full){
  const key = `tr_${full ? "full" : "meta"}_${a.slug}_${a.date}`;
  const cached = store.get(key);
  if (cached){ try { return JSON.parse(cached); } catch(e){} }
  const meta = [a.series, a.title, a.summary];
  let lines = meta.slice();
  let bodyLines = [];
  if (full){
    bodyLines = a.body.trim().split("\n").map(l => l.trim()).filter(Boolean);
    lines = lines.concat(
      [a.cta?.title || "", a.cta?.text || "", a.question || ""],
      (a.poll || []).map(o => o.label),
      bodyLines
    );
  }
  const tr = await translateLines(lines);
  const en = { series: tr[0], title: tr[1], summary: tr[2] };
  if (full){
    en.cta = { title: tr[3], text: tr[4] };
    en.question = tr[5];
    const pn = (a.poll || []).length;
    en.poll = tr.slice(6, 6 + pn);
    en.body = tr.slice(6 + pn).map(l => l.replace(/^[“"](.*)[”"]$/, "「$1」").replace(/\*\*\s*(.+?)\s*\*\*/g, "**$1**")).join("\n");
  }
  en.auto = true;
  store.set(key, JSON.stringify(en));
  return en;
}
async function localize(a, full){
  if (lang === "zh") return { ...a, auto: false };
  const en = a.en || await autoEn(a, full);
  const poll = a.poll ? a.poll.map((o, i) => ({ ...o, label: (en.poll && en.poll[i]) || o.label })) : null;
  return { ...a, ...en, cta: en.cta || a.cta, poll, auto: !a.en };
}

/* ---------- 工具 ---------- */
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
const dnaLink = slug => `${SITE.dnaUrl}?utm_source=articles&utm_medium=article&utm_campaign=${encodeURIComponent(slug || "home")}&utm_content=${lang}`;
const readMin = body => lang === "zh"
  ? Math.max(1, Math.round(body.replace(/\s/g, "").length / 400))
  : Math.max(1, Math.round(body.split(/\s+/).length / 220));

function format(body){
  const lines = body.trim().split("\n").map(l => l.trim()).filter(Boolean);
  let html = "", steps = [];
  const flush = () => { if (steps.length){ html += `<ol class="steps">${steps.join("")}</ol>`; steps = []; } };
  for (const l of lines){
    const step = l.match(/^([①②③④⑤⑥⑦⑧⑨])\s*(.*)$/);
    if (step){ const n = "①②③④⑤⑥⑦⑧⑨".indexOf(step[1]) + 1; steps.push(`<li><b>${n}</b><span>${inline(step[2])}</span></li>`); continue; }
    flush();
    if (/^[—\-]{3,}$/.test(l)) html += "<hr>";
    else if (/^「.*」$/.test(l)) html += `<blockquote>${inline(lang === "en" ? "“" + l.slice(1, -1) + "”" : l)}</blockquote>`;
    else html += `<p>${inline(l)}</p>`;
  }
  flush();
  return html;
}

function chrome(){

/* ============================================================
   投票：存在 WealthDNA 的 Supabase（wealth_poll_responses 表，source = article）
   中英文读者的票算在一起
   ============================================================ */
const SB = {
  url: "https://djmnchkcfaoqiqkjgzit.supabase.co/rest/v1/wealth_poll_responses",
  key: "sb_publishable_ojAnQYRVhrkQTJgFYlFBxg_t_encC7M"
};
const sbHeaders = { apikey: SB.key, Authorization: "Bearer " + SB.key, "Content-Type": "application/json" };

async function poll(a){
  const box = document.getElementById("poll");
  const mine = store.get("poll_voted_" + a.slug);
  if (mine) return showResults(a, mine);
  box.innerHTML = a.poll.map(o =>
    `<button class="opt" data-k="${o.key}"><span class="ico">${o.emoji || o.key}</span><span class="txt">${esc(o.label)}</span></button>`).join("");
  box.querySelectorAll(".opt").forEach(btn => btn.onclick = async () => {
    box.querySelectorAll(".opt").forEach(b => b.disabled = true);
    btn.classList.add("picked");
    try {
      await fetch(SB.url, { method: "POST", headers: { ...sbHeaders, Prefer: "return=minimal" },
        body: JSON.stringify({ poll_id: a.slug, answer: btn.dataset.k, source: lang === "en" ? "article_en" : "article" }) });
    } catch(e){}
    store.set("poll_voted_" + a.slug, btn.dataset.k);
    setTimeout(() => showResults(a, btn.dataset.k), 500);
  });
}

async function showResults(a, mine){
  const box = document.getElementById("poll");
  box.innerHTML = `<div class="loading">${t().loading}</div>`;
  let rows = [];
  try {
    const r = await fetch(`${SB.url}?select=answer&poll_id=eq.${encodeURIComponent(a.slug)}`, { headers: sbHeaders });
    rows = await r.json();
  } catch(e){}
  if (!Array.isArray(rows)) rows = [];
  const total = rows.length;
  const counts = a.poll.map(o => rows.filter(r => r.answer === o.key).length);
  const mi = a.poll.findIndex(o => o.key === mine);
  const myPct = total && mi >= 0 ? Math.round(counts[mi] / total * 100) : 0;
  const react = total <= 1 ? t().reactFirst : (counts[mi] === Math.max(...counts) ? t().reactSame(myPct) : t().reactFew(myPct));
  box.innerHTML = `<div class="react">${react}</div><div class="cols">` + a.poll.map((o, i) => {
    const pct = total ? Math.round(counts[i] / total * 100) : 0;
    const isMe = o.key === mine;
    return `<div class="col ${isMe ? "me" : ""}">
      <div class="pct">${pct}%</div>
      <div class="track"><div class="fill" data-h="${pct}"></div></div>
      <div class="ico">${o.emoji || o.key}</div>
      <div class="lbl">${esc(o.label)}</div>
      ${isMe ? `<div class="you">${t().mine}</div>` : ""}
    </div>`;
  }).join("") + `</div><div class="poll-foot">${total ? t().total(total) : t().first}</div>`;
  setTimeout(() => box.querySelectorAll(".fill").forEach(f => f.style.height = Math.max(4, +f.dataset.h) + "%"), 80);
}

/* ============================================================
   留言区：存在 Supabase 的 article_comments 表
   想隐藏某条留言：到 Supabase → Table Editor → article_comments，把 hidden 打勾
   ============================================================ */
const CM_URL = "https://djmnchkcfaoqiqkjgzit.supabase.co/rest/v1/article_comments";

async function loadComments(a){
  const list = document.getElementById("clist");
  if (!list) return;
  let rows = [];
  try {
    const r = await fetch(`${CM_URL}?select=name,body,choice,created_at&slug=eq.${encodeURIComponent(a.slug)}&order=created_at.desc&limit=200`, { headers: sbHeaders });
    rows = await r.json();
  } catch(e){}
  if (!Array.isArray(rows)) rows = [];
  document.getElementById("cCount").textContent = rows.length ? " " + t().cCount(rows.length) : "";
  const label = k => { const o = (a.poll || []).find(p => p.key === k); return o ? `${o.emoji || ""} ${o.label}` : ""; };
  list.innerHTML = rows.length ? rows.map(c => {
    const secs = Math.max(0, (Date.now() - new Date(c.created_at)) / 1000);
    return `<div class="c">
      <div class="av">${esc((c.name || "?").trim().charAt(0).toUpperCase())}</div>
      <div>
        <div class="who">${esc(c.name)}<small>${t().ago(secs)}</small></div>
        ${c.choice && label(c.choice) ? `<div class="pick">${t().cPicked} ${esc(label(c.choice))}</div>` : ""}
        <p>${esc(c.body)}</p>
      </div>
    </div>`;
  }).join("") : `<div class="empty">${t().cEmpty}</div>`;
}

function comments(a){
  const form = document.getElementById("cform");
  const savedName = store.get("comment_name");
  if (savedName) document.getElementById("cName").value = savedName;
  form.onsubmit = async e => {
    e.preventDefault();
    const btn = form.querySelector("button");
    const name = document.getElementById("cName").value.trim().slice(0, 40) || t().cAnon;
    const body = document.getElementById("cBody").value.trim().slice(0, 600);
    if (!body) return;
    btn.disabled = true; btn.textContent = t().cSending;
    let ok = false;
    try {
      const r = await fetch(CM_URL, { method: "POST", headers: { ...sbHeaders, Prefer: "return=minimal" },
        body: JSON.stringify({ slug: a.slug, name, body, choice: store.get("poll_voted_" + a.slug), lang }) });
      ok = r.ok;
    } catch(err){}
    btn.disabled = false; btn.textContent = t().cSend;
    if (!ok) return alert(t().cFail);
    if (name !== t().cAnon) store.set("comment_name", name);
    document.getElementById("cBody").value = "";
    loadComments(a);
  };
  loadComments(a);
}

/* ---------- 切换页面 ---------- */
const currentSlug = () => { try { return location.hash.replace(/^#\/?/, ""); } catch(e){ return ""; } };
function show(slug){
  chrome();
  const i = ARTICLES.findIndex(a => a.slug === slug);
  i >= 0 ? article(ARTICLES[i], i) : home();
  window.scrollTo(0, 0);
}
document.addEventListener("click", e => {
  const a = e.target.closest('a[href^="#/"]');
  if (!a) return;
  e.preventDefault();
  const slug = a.getAttribute("href").slice(2);
  try { history.pushState(null, "", "#/" + slug); } catch(err){}
  show(slug);
});
document.getElementById("langBtn").addEventListener("click", () => {
  lang = lang === "zh" ? "en" : "zh";
  store.set("lang", lang);
  show(currentSlug());
});
window.addEventListener("popstate", () => show(currentSlug()));
show(currentSlug());
